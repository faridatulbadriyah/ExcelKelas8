<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
    <!-- Background -->
    <rect x="0" y="0" width="400" height="300" rx="16" fill="#F0F7F0"/>
    
    <!-- Window Excel -->
    <rect x="40" y="30" width="320" height="230" rx="12" fill="white" stroke="#217346" stroke-width="2.5"/>
    
    <!-- Title Bar -->
    <rect x="40" y="30" width="320" height="36" rx="12" fill="#217346" fill-opacity="0.08"/>
    <rect x="40" y="48" width="320" height="18" fill="#217346" fill-opacity="0.08"/>
    
    <!-- Traffic Lights -->
    <circle cx="62" cy="48" r="6" fill="#FF5F56"/>
    <circle cx="80" cy="48" r="6" fill="#FFBD2E"/>
    <circle cx="98" cy="48" r="6" fill="#27C93F"/>
    
    <!-- Title Text -->
    <text x="155" y="53" font-family="Arial, sans-serif" font-size="13" fill="#217346" font-weight="700">📊 Excel Zone</text>
    
    <!-- Grid Lines -->
    <line x1="60" y1="86" x2="340" y2="86" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="60" y1="116" x2="340" y2="116" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="60" y1="146" x2="340" y2="146" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="60" y1="176" x2="340" y2="176" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="60" y1="206" x2="340" y2="206" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="60" y1="236" x2="340" y2="236" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <line x1="160" y1="86" x2="160" y2="250" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="250" y1="86" x2="250" y2="250" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header Cells -->
