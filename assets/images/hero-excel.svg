    <rect x="160" y="86" width="90" height="30" rx="4" fill="#217346" fill-opacity="0.05"/>
    <rect x="250" y="86" width="90" height="30" rx="4" fill="#217346" fill-opacity="0.05"/>
    
    <text x="88" y="105" font-family="Arial, sans-serif" font-size="11" fill="#217346" font-weight="600">Nama</text>
    <text x="183" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666" font-weight="600">Nilai</text>
    <text x="275" y="105" font-family="Arial, sans-serif" font-size="11" fill="#666" font-weight="600">Status</text>
    
    <!-- Data Row 1 -->
    <text x="75" y="135" font-family="Arial, sans-serif" font-size="12" fill="#333">Salma</text>
    <text x="190" y="135" font-family="Arial, sans-serif" font-size="12" fill="#217346" font-weight="700">92</text>
    <rect x="260" y="124" width="60" height="18" rx="9" fill="#E2F0D9"/>
    <text x="277" y="137" font-family="Arial, sans-serif" font-size="10" fill="#217346" font-weight="600">Lulus</text>
    
    <!-- Data Row 2 -->
    <text x="75" y="165" font-family="Arial, sans-serif" font-size="12" fill="#333">Raka</text>
    <text x="190" y="165" font-family="Arial, sans-serif" font-size="12" fill="#217346" font-weight="700">86</text>
    <rect x="260" y="154" width="60" height="18" rx="9" fill="#E2F0D9"/>
    <text x="277" y="167" font-family="Arial, sans-serif" font-size="10" fill="#217346" font-weight="600">Lulus</text>
    
    <!-- Data Row 3 -->
    <text x="75" y="195" font-family="Arial, sans-serif" font-size="12" fill="#333">Dina</text>
    <text x="190" y="195" font-family="Arial, sans-serif" font-size="12" fill="#FF9B00" font-weight="700">74</text>
    <rect x="260" y="184" width="60" height="18" rx="9" fill="#FFF2D9"/>
    <text x="277" y="197" font-family="Arial, sans-serif" font-size="10" fill="#FF9B00" font-weight="600">Lulus</text>
    
    <!-- Data Row 4 -->
    <text x="75" y="225" font-family="Arial, sans-serif" font-size="12" fill="#333">Bayu</text>
    <text x="190" y="225" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C" font-weight="700">55</text>
