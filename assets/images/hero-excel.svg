    <text x="72" y="260" font-family="Arial, sans-serif" font-size="9" fill="#217346" font-weight="600">📄 Sheet1</text>
    
    <!-- Decorative Elements -->
    <circle cx="340" cy="70" r="4" fill="#217346" fill-opacity="0.15"/>
    <circle cx="330" cy="70" r="4" fill="#217346" fill-opacity="0.10"/>
    <circle cx="350" cy="70" r="4" fill="#217346" fill-opacity="0.20"/>
